<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ops Console</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath d=%27M2 14.5 22 6l-6.5 14-3-6.5L2 14.5Z%27 fill=%27%231d4e89%27/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="brand" href="/" id="brand">Empty Leg Tracker</a>
      <span class="faint">Operations</span>
      <nav class="links"><a href="/">Traveler site</a><a href="/operator">Operator portal</a></nav>
    </div>
  </header>
  <main class="wrap">
    <section id="login" class="card pad" style="max-width:460px;margin:48px auto">
      <h2>Ops sign in</h2>
      <form class="stack" id="login-form"><label>Admin key<input id="key" required autocomplete="off" placeholder="ADMIN_KEY"></label><button>Sign in</button></form>
    </section>
    <section id="ops" hidden>
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="operators" aria-selected="true">Operators</button>
        <button role="tab" data-tab="prospects" aria-selected="false">Prospects</button>
        <button role="tab" data-tab="bookings" aria-selected="false">Bookings</button>
        <button role="tab" data-tab="inbox" aria-selected="false">Inbox <span id="attn" class="tag warn" hidden></span></button>
        <button role="tab" data-tab="review" aria-selected="false">Review queue</button>
        <button role="tab" data-tab="market" aria-selected="false">Market</button>
        <button role="tab" data-tab="charters" aria-selected="false">Charter requests</button>
        <button role="tab" data-tab="integrations" aria-selected="false">Integrations</button>
        <button role="tab" data-tab="errors" aria-selected="false">Feed errors</button>
        <button role="tab" data-tab="outbox" aria-selected="false">Notifications</button>
        <button role="tab" data-tab="ledger" aria-selected="false">Ledger</button>
      </div>
      <div id="panel"></div>
    </section>
  </main>
  <script type="module" src="/admin.js"></script>
</body>
</html>
